[workspace]
resolver = "2"
members = ["oxidegl", "oxidegl_c", "oxidegl_shim", "xtask"]

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
debug = true

[profile.dev]
debug = "line-tables-only"
codegen-units = 512
# lto = "thin"
panic = "abort"
incremental = true

[workspace.dependencies]

oxidegl = { path = "oxidegl" }
oxidegl_c = { path = "oxidegl_c" }

strum_macros = "0.27.1"
objc2-app-kit = { default-features = false, version = "0.3.1" }
objc2 = "0.6.1"
log = "0.4.21"
likely_stable = "0.1.2"

objc2-foundation = { default-features = false, version = "0.3.0", features = [
    "std",
    "NSProcessInfo",
] }
